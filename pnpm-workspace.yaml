packages:
  - "apps/*"
  - "packages/*"

overrides:
  lightningcss: 1.30.1

allowBuilds:
  "@firebase/util": true
  "@tailwindcss/oxide": true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@expo/cli@57.0.25"
  - "@expo/router-server@57.0.10"
  - babel-preset-expo@57.0.12
  - expo@57.0.23
  - prettier@3.9.7

nodeLinker: hoisted

onlyBuiltDependencies:
  - "@firebase/util"
  - protobufjs
  - sharp
  - unrs-resolver
