packages:
  - "apps/*"
  - "packages/*"

overrides:
  lightningcss: 1.30.1
  react: "19.2.3"
  react-native: "0.86.3"

allowBuilds:
  "@firebase/util": true
  "@tailwindcss/oxide": true
  protobufjs: true
  sharp: true
  unrs-resolver: true

nodeLinker: hoisted

onlyBuiltDependencies:
  - "@firebase/util"
  - protobufjs
  - sharp
  - unrs-resolver

minimumReleaseAge: 0
