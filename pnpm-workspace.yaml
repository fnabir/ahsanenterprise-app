packages:
  - "apps/*"
  - "packages/*"

overrides:
  lightningcss: 1.30.1

allowBuilds:
  "@firebase/util": true
  protobufjs: true
  sharp: true
  unrs-resolver: true

nodeLinker: hoisted

onlyBuiltDependencies:
  - "@firebase/util"
  - protobufjs
  - sharp
  - unrs-resolver

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.12'
  - '@turbo/darwin-arm64@2.10.12'
  - '@turbo/linux-64@2.10.12'
  - '@turbo/linux-arm64@2.10.12'
  - '@turbo/windows-64@2.10.12'
  - '@turbo/windows-arm64@2.10.12'
  - turbo@2.10.12
