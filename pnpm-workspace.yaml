packages:
  - "apps/*"
  - "packages/*"

overrides:
  lightningcss: 1.30.1

allowBuilds:
  "@firebase/util": true
  protobufjs: true
  sharp: true
  unrs-resolver: true

nodeLinker: hoisted

onlyBuiltDependencies:
  - "@firebase/util"
  - protobufjs
  - sharp
  - unrs-resolver

minimumReleaseAgeExclude:
  - '@types/react-dom@19.2.7'
