packages:
  - "apps/*"
  - "packages/*"

overrides:
  lightningcss: 1.30.1

allowBuilds:
  "@firebase/util": true
  "@tailwindcss/oxide": true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.25 || 57.0.26 || 57.0.27'
  - '@expo/router-server@57.0.10 || 57.0.11'
  - babel-preset-expo@57.0.12 || 57.0.13
  - expo@57.0.23 || 57.0.24 || 57.0.25
  - prettier@3.9.7 || 3.9.8
  - '@react-navigation/bottom-tabs@7.19.2'
  - '@react-navigation/elements@2.9.43'
  - expo-asset@57.0.18
  - expo-constants@57.0.19
  - '@expo/metro-runtime@57.0.16'
  - '@expo/ui@57.0.19 || 57.0.20'
  - expo-router@57.0.22 || 57.0.23
  - '@types/node@24.13.6'
  - framer-motion@13.4.3
  - motion-dom@13.4.2
  - expo-glass-effect@57.0.4
  - expo-linking@57.0.11
  - expo-modules-core@57.0.19
  - expo-modules-jsi@57.1.1

nodeLinker: hoisted

onlyBuiltDependencies:
  - "@firebase/util"
  - protobufjs
  - sharp
  - unrs-resolver
